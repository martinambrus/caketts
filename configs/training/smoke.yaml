# Edit paths to prepared inputs; relative paths resolve from this YAML.
# CPU fp32, constant tempo bootstrap, no transcript/audio edits or crops.
stage: 2
output_dir: ../../outputs/acoustic-smoke
data:
  train_manifest: ../../data/manifests/train.jsonl
  val_manifest: ../../data/manifests/val.jsonl
  vocab: ../../data/vocab.json
  lexicon: null
  speaker_ids: {narrator: 0}
  min_duration_s: 1.0
  max_duration_s: 2.0
  max_train_items: 4
  max_val_items: 2
  stats_max_items: 4
  g2p: {}
model:
  enc_dim: 32
  enc_layers: 1
  enc_heads: 2
  enc_ff: 64
  spk_dim: 8
  cond_dim: 8
  dur_hidden: 32
  dec_dim: 32
  dec_levels: 1
  dropout: 0.0
training:
  device: cpu
  precision: fp32
  seed: 2026
  max_steps: 3
  batch_frames: 400
  bucket_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
  validate_every: 1
  checkpoint_every: 1
tempo: {articulation_rate: 12.0, pause_ratio: 0.1}
