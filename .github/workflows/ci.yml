name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Cache the Stanza models of the text normalizer
        uses: actions/cache@v6
        with:
          path: ~/.cache/stanza
          key: stanza-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: stanza-${{ runner.os }}-
      - name: Clone BigVGAN at the tested commit
        run: |
          git clone https://github.com/NVIDIA/BigVGAN third_party/BigVGAN
          git -C third_party/BigVGAN checkout --quiet 7d2b454
      - run: uv run pytest tests/ -q
