[project]
name = "caketts"
version = "0.1.0"
description = "Slovak, Czech and English audiobook TTS in one narrator's voice"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "soundfile>=0.14.0",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "numba>=0.67.0",
    "phonemizer>=3.4.0",
    "espeakng-loader>=0.2.4",
    "pyloudnorm>=0.2.0",
    "transformers>=5.17.0",
    "jiwer>=4.0.0",
    "einops>=0.8.2",
    "pyyaml>=6.0.3",
    "hydra-core>=1.3.7",
    "wandb>=0.30.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
python-preference = "only-managed"
# ext4 (WSL) has no copy-on-write, so uv's default "clone" would store every package twice
link-mode = "hardlink"

# CPU build locally; the training machine switches this index to CUDA (plan, Prompt 1.1)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
